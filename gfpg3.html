<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift page 3</title>
    <style>
        :root {
            color-scheme: light;
            font-family: 'Inter', system-ui, sans-serif;
            background: #faf6ff;
            color: #30213b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 22px;
            background: radial-gradient(circle at top left, #fff2ff 0%, #f9eefb 32%, #f4ebff 62%, #efe2ff 100%);
        }

        .page-title {
            max-width: 960px;
            margin: 0 auto 32px;
            padding: 0 16px;
            text-align: center;
        }

        .page-title h1 {
            margin: 0;
            font-size: clamp(2.4rem, 4vw, 3.6rem);
            letter-spacing: -0.05em;
            color: #622b7b;
            text-transform: uppercase;
            text-shadow: 0 4px 12px rgba(98, 43, 123, 0.16);
        }

        .page-title p {
            margin: 18px auto 0;
            max-width: 640px;
            font-size: 1.05rem;
            color: #5b3f68;
            line-height: 1.8;
            letter-spacing: 0.01em;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 28px;
            max-width: 1180px;
            margin: 0 auto;
            padding: 6px;
        }

        .card {
            position: relative;
            overflow: hidden;
            border-radius: 34px;
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 28px 60px rgba(111, 71, 151, 0.16);
            transition: transform 0.36s ease, box-shadow 0.36s ease;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.01);
            box-shadow: 0 42px 88px rgba(111, 71, 151, 0.2);
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.8), transparent 35%), radial-gradient(circle at bottom left, rgba(229, 118, 210, 0.14), transparent 28%);
            pointer-events: none;
        }

        .card::after {
            content: '';
            position: absolute;
            left: -14%;
            top: -24%;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.42);
            border-radius: 50%;
            filter: blur(18px);
            pointer-events: none;
        }

        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
            border-top-left-radius: 34px;
            border-top-right-radius: 34px;
        }

        .card figcaption {
            position: relative;
            padding: 20px 22px 26px;
            display: grid;
            gap: 8px;
            z-index: 1;
        }

        .card strong {
            display: block;
            font-size: 1.08rem;
            color: #3e1f4f;
        }

        .card span {
            display: block;
            color: #6e4a78;
            font-size: 0.96rem;
            line-height: 1.7;
        }

        .card .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: max-content;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(110, 71, 154, 0.11);
            color: #5b3273;
            font-size: 0.88rem;
            letter-spacing: 0.02em;
        }

        @media (max-width: 720px) {
            .gallery {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }

            .card img {
                height: 260px;
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 24px 14px;
            }

            .card img {
                height: 220px;
            }
        }
    </style>
</head>
<body>
    <section class="page-title">
        <h1>Thangoo’s Photo Gallery</h1>
      

    <section class="gallery">
        <figure class="card"><img src="img/us.jpeg" alt="Photo 1"><figcaption><strong>love you</strong><span></span></figcaption></figure>

        <figure class="card"><img src="img/img5.jpeg" alt="Photo 6"><figcaption><strong>Always be with you</strong><span> </span></figcaption></figure>

</body>
</html>
