<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love you</title>
    <style>
        :root {
            color-scheme: light;
            font-family: 'Poppins', system-ui, sans-serif;
            background: #fff5fb;
            color: #3a1f39;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px;
            background: linear-gradient(135deg, #fff4fc 0%, #fcebfb 40%, #f7e4f5 70%, #f3e6fa 100%);
            background-attachment: fixed;
        }

        .card {
            position: relative;
            width: min(100%, 780px);
            padding: 46px 42px;
            border-radius: 42px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.78);
            box-shadow: 0 35px 100px rgba(145, 73, 144, 0.14);
            backdrop-filter: blur(18px);
            text-align: center;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top left, rgba(255, 186, 223, 0.22), transparent 22%), radial-gradient(circle at bottom right, rgba(196, 150, 228, 0.18), transparent 24%);
            pointer-events: none;
        }

        h1 {
            margin: 0 0 18px;
            font-size: clamp(3rem, 6vw, 4.6rem);
            line-height: 1;
            color: #7e2f74;
            letter-spacing: -0.05em;
            text-shadow: 0 10px 20px rgba(125, 57, 115, 0.16);
        }

        p {
            margin: 0 auto;
            max-width: 640px;
            font-size: 1.08rem;
            line-height: 1.9;
            color: #5b3a5a;
            opacity: 0.96;
        }

        .heart {
            display: inline-block;
            margin-top: 24px;
            font-size: 2rem;
            color: #d9449f;
            transform: translateY(2px);
        }

        @media (max-width: 600px) {
            .card {
                padding: 32px 24px;
            }

            h1 {
                font-size: 2.8rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <section class="card">
        <h1>Love You</h1>
        <p>Every beat of my heart carries your name. This page blooms in soft color and gentle light, just like the feeling I have when I think of you.</p>
        <div class="heart">❤</div>
    </section>
</body>
</html>
